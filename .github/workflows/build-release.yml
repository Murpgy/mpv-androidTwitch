name: build-release

# Well-optimized production APKs for TwitchMPV (is.xyz.mpv.twitch)
# - builds release variants with R8 + shrinkResources + crunchPngs
# - produces signed/unsigned universal + split APKs + AAB
# - optimized for battery-efficient background audio playback

on:
  push:
    tags: ['v*', 'release-*']
    branches: ['master', 'main', 'twitch*']
  pull_request:
  workflow_dispatch:
    inputs:
      sign:
        description: 'Sign APKs if ANDROID_SIGNING_KEY secret is set'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: Export env vars
        run: buildscripts/include/ci.sh export >>$GITHUB_ENV

      - name: Enable Gradle cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            gh-cache/
          key: "release-${{ env.CACHE_IDENTIFIER }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}"
          restore-keys: |
            release-${{ env.CACHE_IDENTIFIER }}-
            ${{ env.CACHE_IDENTIFIER }}-
          enableCrossOsArchive: true

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf pkgconf libtool ninja-build python3-pip gperf nasm
          sudo pip3 install meson
          echo "cores=$(nproc)" >> $GITHUB_ENV

      - name: Download or build deps (native mpv + ffmpeg)
        run: |
          mkdir -p "$CACHE_FOLDER"
          buildscripts/include/ci.sh install
        env:
          CACHE_MODE: "folder"
          CACHE_FOLDER: "${{ github.workspace }}/gh-cache"

      - name: Build optimized release (native + Java)
        run: |
          # DONT_BUILD_RELEASE must be unset to build release
          unset DONT_BUILD_RELEASE
          # Ensure release build is well-optimized: use R8 fullMode, shrink, crunchPngs (configured in app/build.gradle)
          # Build both debug and release; release will be minified + shrunk
          buildscripts/include/ci.sh build
        env:
          CACHE_MODE: "folder"
          CACHE_FOLDER: "${{ github.workspace }}/gh-cache"

      - name: Show release outputs
        run: |
          echo "=== default/release ==="; ls -lh app/build/outputs/apk/default/release/* 2>&1 || true
          echo "=== allstorage/release ==="; ls -lh app/build/outputs/apk/allstorage/release/* 2>&1 || true
          echo "=== default/debug ==="; ls -lh app/build/outputs/apk/default/debug/* 2>&1 || true
          echo "=== allstorage/debug ==="; ls -lh app/build/outputs/apk/allstorage/debug/* 2>&1 || true
          echo "=== bundles ==="; ls -lh app/build/outputs/bundle/*/* 2>&1 || true

      # Upload production artifacts (release unsigned/signed)
      - name: Upload release APKs (default)
        uses: actions/upload-artifact@v7
        with:
          name: twitchmpv-release-default
          path: |
            app/build/outputs/apk/default/release/*.apk
            app/build/outputs/apk/default/release/*.apk.sha256
          if-no-files-found: warn
          compression-level: 0

      - name: Upload release APKs (allstorage)
        uses: actions/upload-artifact@v7
        with:
          name: twitchmpv-release-allstorage
          path: |
            app/build/outputs/apk/allstorage/release/*.apk
          if-no-files-found: warn
          compression-level: 0

      - name: Upload release AAB (Play)
        uses: actions/upload-artifact@v7
        with:
          name: twitchmpv-release-aab
          path: |
            app/build/outputs/bundle/defaultRelease/*.aab
          if-no-files-found: warn
          compression-level: 0

      - name: Upload debug APKs (for testing)
        uses: actions/upload-artifact@v7
        with:
          name: twitchmpv-debug-default
          path: |
            app/build/outputs/apk/default/debug/*.apk
          if-no-files-found: warn

      - name: Upload debug APKs allstorage (for testing - Android 11+)
        uses: actions/upload-artifact@v7
        with:
          name: twitchmpv-debug-allstorage
          path: |
            app/build/outputs/apk/allstorage/debug/*.apk
          if-no-files-found: warn

      # Optionally sign if secret provided (replicates mpv-android.sh signing)
      - name: Sign release APKs (if ANDROID_SIGNING_KEY available)
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          ANDROID_SIGNING_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
        run: |
          if [ -z "$ANDROID_SIGNING_KEY" ]; then
            echo "No ANDROID_SIGNING_KEY secret set - skipping extra signing"
            exit 0
          fi
          # signing is already attempted inside mpv-android.sh if ANDROID_SIGNING_KEY is set at build time
          # this step re-signs unsigned apks if build was without key at first
          if ls app/build/outputs/apk/default/release/*-unsigned.apk 1>/dev/null 2>&1; then
            echo "Signing unsigned release APKs..."
            BT_VER=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)
            apksigner="$ANDROID_HOME/build-tools/$BT_VER/apksigner"
            for f in app/build/outputs/apk/default/release/*-unsigned.apk app/build/outputs/apk/allstorage/release/*-unsigned.apk; do
              [ -f "$f" ] || continue
              out="${f/-unsigned/-signed}"
              "$apksigner" sign --ks "$ANDROID_SIGNING_KEY" --in "$f" --out "$out" || echo "sign failed for $f"
            done
          else
            echo "No unsigned APKs to sign (already signed or no release)"
          fi

      - name: Generate checksums
        run: |
          cd app/build/outputs
          find . -name "*.apk" -o -name "*.aab" | xargs -r sha256sum | tee checksums.txt
          cat checksums.txt || true
          cp checksums.txt ../../checksums.txt 2>/dev/null || true
        continue-on-error: true

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/default/release/*.apk
            app/build/outputs/apk/allstorage/release/*.apk
            app/build/outputs/bundle/defaultRelease/*.aab
            checksums.txt
          generate_release_notes: true
          fail_on_unmatched_files: false

name: build-release

# Well-optimized production APKs for TwitchMPV (is.xyz.mpv.twitch)
# - builds release variants with R8 + shrinkResources + crunchPngs
# - produces signed/unsigned universal + split APKs + AAB
# - optimized for battery-efficient background audio playback

on:
  push:
    tags: ['v*', 'release-*']
    branches: ['master', 'main', 'twitch*']
  pull_request:
  workflow_dispatch:
    inputs:
      sign:
        description: 'Sign APKs if ANDROID_SIGNING_KEY secret is set'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: Export env vars
        run: buildscripts/include/ci.sh export >>$GITHUB_ENV

      - name: Enable Gradle cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            gh-cache/
          key: "release-${{ env.CACHE_IDENTIFIER }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}"
          restore-keys: |
            release-${{ env.CACHE_IDENTIFIER }}-
            ${{ env.CACHE_IDENTIFIER }}-
          enableCrossOsArchive: true

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf pkgconf libtool ninja-build python3-pip gperf nasm
          sudo pip3 install meson
          echo "cores=$(nproc)" >> $GITHUB_ENV

      - name: Download or build deps (native mpv + ffmpeg)
        run: |
          mkdir -p "$CACHE_FOLDER"
          buildscripts/include/ci.sh install
        env:
          CACHE_MODE: "folder"
          CACHE_FOLDER: "${{ github.workspace }}/gh-cache"

      - name: Build optimized release (native + Java)
        run: |
          # DONT_BUILD_RELEASE must be unset to build release
          unset DONT_BUILD_RELEASE
          # Ensure release build is well-optimized: use R8 fullMode, shrink, crunchPngs (configured in app/build.gradle)
          # Build both debug and release; release will be minified + shrunk
          buildscripts/include/ci.sh build
        env:
          CACHE_MODE: "folder"
          CACHE_FOLDER: "${{ github.workspace }}/gh-cache"

      - name: Sign release APKs (always produce installable)
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          ANDROID_SIGNING_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
        run: |
          # mpv-android.sh only signs release when ANDROID_SIGNING_KEY is set at build time.
          # Without a secret, Gradle produces *-unsigned.apk which Android 15 rejects
          # (INSTALL_PARSE_FAILED_NO_CERTIFICATES -> "package appears to be invalid").
          # Fix: always sign - use real key if provided, else generate ephemeral CI key and sign.
          set -x
          # Find apksigner robustly (ANDROID_HOME vs ANDROID_SDK_ROOT)
          BT_VER=$(ls "$ANDROID_HOME/build-tools" 2>/dev/null | sort -V | tail -n1)
          if [ -z "$BT_VER" ]; then BT_VER=$(ls "$ANDROID_SDK_ROOT/build-tools" 2>/dev/null | sort -V | tail -n1); fi
          echo "build-tools version: $BT_VER"
          APS="$ANDROID_HOME/build-tools/$BT_VER/apksigner"
          if [ ! -x "$APS" ]; then APS="$ANDROID_SDK_ROOT/build-tools/$BT_VER/apksigner"; fi
          ls -l "$APS" || true
          hasUnsigned=false
          if compgen -G "app/build/outputs/apk/default/release/*-unsigned.apk" > /dev/null 2>&1; then hasUnsigned=true; fi
          if compgen -G "app/build/outputs/apk/allstorage/release/*-unsigned.apk" > /dev/null 2>&1; then hasUnsigned=true; fi
          if [ -n "$ANDROID_SIGNING_KEY" ] && [ -f "$ANDROID_SIGNING_KEY" ]; then
            echo "Signing with provided ANDROID_SIGNING_KEY..."
            for f in app/build/outputs/apk/default/release/*-unsigned.apk app/build/outputs/apk/allstorage/release/*-unsigned.apk; do
              [ -f "$f" ] || continue
              out="${f/-unsigned/-signed}"
              "$APS" sign --ks "$ANDROID_SIGNING_KEY" --in "$f" --out "$out" && echo "signed $out" || { echo "apksigner failed for $f"; exit 1; }
            done
          elif [ "$hasUnsigned" = true ]; then
            echo "No signing key - generating ephemeral CI keystore..."
            rm -f /tmp/ci.jks
            keytool -genkeypair -keystore /tmp/ci.jks -storepass ci -keypass ci -alias ci -dname "CN=CI, OU=CI, O=CI" -validity 10000 -keyalg RSA -keysize 2048
            echo "keystore created: $(ls -lh /tmp/ci.jks)"
            for f in app/build/outputs/apk/default/release/*-unsigned.apk app/build/outputs/apk/allstorage/release/*-unsigned.apk; do
              [ -f "$f" ] || continue
              out="${f/-unsigned/-signed}"
              echo "Signing $f -> $out"
              "$APS" sign --ks /tmp/ci.jks --ks-pass pass:ci --ks-key-alias ci --key-pass pass:ci --in "$f" --out "$out" || { echo "apksigner failed for $f"; exit 1; }
              echo "signed $out (ephemeral)"
              rm -f "$f"
            done
          else
            echo "No unsigned APKs to sign (already signed)"
          fi
          echo "Verifying..."
          for f in app/build/outputs/apk/default/release/*.apk app/build/outputs/apk/allstorage/release/*.apk; do
            [ -f "$f" ] || continue
            echo "verify $f"
            "$APS" verify --verbose "$f" 2>&1 | head -n 20 || true
          done
          echo "Done signing"

      - name: Show release outputs (after signing)
        run: |
          echo "=== default/release ==="; ls -lh app/build/outputs/apk/default/release/* 2>&1 || true
          echo "=== allstorage/release ==="; ls -lh app/build/outputs/apk/allstorage/release/* 2>&1 || true
          echo "=== default/debug ==="; ls -lh app/build/outputs/apk/default/debug/* 2>&1 || true
          echo "=== allstorage/debug ==="; ls -lh app/build/outputs/apk/allstorage/debug/* 2>&1 || true
          echo "=== bundles ==="; ls -lh app/build/outputs/bundle/*/* 2>&1 || true

      # Upload production artifacts (now signed and installable)
      - name: Upload release APKs (default)
        uses: actions/upload-artifact@v7
        with:
          name: twitchmpv-release-default
          path: |
            app/build/outputs/apk/default/release/*.apk
            app/build/outputs/apk/default/release/*.apk.sha256
          if-no-files-found: warn
          compression-level: 0

      - name: Upload release APKs (allstorage)
        uses: actions/upload-artifact@v7
        with:
          name: twitchmpv-release-allstorage
          path: |
            app/build/outputs/apk/allstorage/release/*.apk
          if-no-files-found: warn
          compression-level: 0

      - name: Upload release AAB (Play)
        uses: actions/upload-artifact@v7
        with:
          name: twitchmpv-release-aab
          path: |
            app/build/outputs/bundle/defaultRelease/*.aab
          if-no-files-found: warn
          compression-level: 0

      - name: Upload debug APKs (for testing)
        uses: actions/upload-artifact@v7
        with:
          name: twitchmpv-debug-default
          path: |
            app/build/outputs/apk/default/debug/*.apk
          if-no-files-found: warn

      - name: Upload debug APKs allstorage (for testing - Android 11+)
        uses: actions/upload-artifact@v7
        with:
          name: twitchmpv-debug-allstorage
          path: |
            app/build/outputs/apk/allstorage/debug/*.apk
          if-no-files-found: warn

      - name: Generate checksums
        run: |
          cd app/build/outputs
          find . -name "*.apk" -o -name "*.aab" | xargs -r sha256sum | tee checksums.txt
          cat checksums.txt || true
          cp checksums.txt ../../checksums.txt 2>/dev/null || true
        continue-on-error: true

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/default/release/*.apk
            app/build/outputs/apk/allstorage/release/*.apk
            app/build/outputs/bundle/defaultRelease/*.aab
            checksums.txt
          generate_release_notes: true
          fail_on_unmatched_files: false
